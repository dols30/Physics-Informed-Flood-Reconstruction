[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-informed-floods"
version = "0.1.0"
description = "Sparse flood reconstruction with measured dam-break benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "h5py>=3.13,<4",
  "matplotlib>=3.10,<4",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7,<8",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
floods = "floods.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
