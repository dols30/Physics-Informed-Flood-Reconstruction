name: Scientific and reproducibility checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-notebook-lock.txt
      - run: python -m pip install -r requirements-notebook-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Execute the showcase notebook
        run: floods run-notebook
      - name: Exercise the paired ablation pipeline
        run: floods sensor-ablation --sensors 16 32 --seeds 42 --steps 10 --output outputs/ci_ablation --reports outputs/ci_reports
